name: Package and release

# Push auf main      => Tag v<Basis>-beta.<Run-Nr> => Beta auf CurseForge
# Tag v* von Hand    => Packager laeuft direkt (ohne "beta" im Namen = Release)
# Run workflow (Button, Branch main, Version angeben) => Tag v<Version> => Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release-Version, z.B. 0.2.0 (nur bei Start auf Branch main)'
        required: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    # Nur auf Branches: Tag erzeugen und Workflow auf dem Tag starten
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag erzeugen und Build starten
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ -n "$VERSION" ] || { echo "Version fehlt"; exit 1; }
            tag="v${VERSION#v}"
          else
            base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-beta*' 2>/dev/null || echo v0.1.0)
            tag="${base}-beta.${GITHUB_RUN_NUMBER}"
          fi
          git tag "$tag"
          git push origin "$tag"
          # Tag-Pushes mit GITHUB_TOKEN loesen keinen Workflow aus => explizit starten
          gh workflow run release.yml --ref "$tag"

  package:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
